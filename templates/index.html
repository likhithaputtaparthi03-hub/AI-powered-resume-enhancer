<!DOCTYPE html>
<html>

<head>

    <title>AI Resume Enhancer</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            margin: 0;

            padding: 40px;

        }


        .container {

            max-width: 700px;

            margin: 50px auto;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        .description {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }


        label {

            font-weight: bold;

            display: block;

            margin-top: 20px;

            margin-bottom: 10px;

        }


        input[type="file"] {

            margin-bottom: 10px;

        }


        textarea {

            width: 100%;

            height: 180px;

            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 6px;

            resize: vertical;

            font-family: Arial;

        }


        button {

            display: block;

            margin: 25px auto 0;

            padding: 12px 30px;

            border: none;

            border-radius: 6px;

            background: #333;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #555;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>AI Resume Enhancer</h1>


    <p class="description">

        Upload your resume and compare it with a job description.

    </p>


    <form
        action="/analyze"
        method="POST"
        enctype="multipart/form-data"
    >


        <label>

            Upload Resume (PDF)

        </label>


        <input
            type="file"
            name="resume"
            accept=".pdf"
            required
        >


        <label>

            Job Description

        </label>


        <textarea
            name="job_description"
            placeholder="Paste the job description here..."
        ></textarea>


        <button type="submit">

            Analyze Resume

        </button>


    </form>


</div>


</body>

</html>
